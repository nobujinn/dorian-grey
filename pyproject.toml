[project]
name = "dorian-gray"
version = "0.1.0"
description = "Explainable detection of synthetic and manipulated images"
readme = "README.md"
authors = [
    { name = "Zakharii Okseniuk" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "open-clip-torch>=2.29",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
    "shap>=0.51.0",
]

[project.scripts]
dorian-gray = "dorian_gray:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

# GTX 1050 (Pascal, sm_61): CUDA 12.8+ PyTorch builds no longer include Pascal kernels,
# so CUDA builds come from the cu126 index. On machines without an NVIDIA GPU this still
# installs and falls back to CPU.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
